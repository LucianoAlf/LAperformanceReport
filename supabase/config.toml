project_id = "ouqwbbermlzqqvtqwlul"

[functions.ficha-emitir-token]
# Chamada somente pelo painel Time com a sessao JWT do usuario logado.
verify_jwt = true

[functions.ficha-tecnica]
# Formulario publico autenticado pelo bearer token proprio da ficha.
verify_jwt = false

[functions.ficha-criar-pessoa]
# Ponte servidor-servidor: valida o segredo sincronizado no próprio código.
verify_jwt = false

[functions.relatorio-admin-whatsapp]
verify_jwt = false

[functions.enviar-pesquisa-evasao]
verify_jwt = true

[functions.processar-resposta-pesquisa]
# Edge interna: chamada pelo webhook autenticado usando o cliente service role.
verify_jwt = true

[functions.transcrever-mensagem-evasao]
# Worker interno: o gateway não aceita a service key opaca usada entre Edges.
# A função valida o bearer por comparação constante com SUPABASE_SERVICE_ROLE_KEY.
verify_jwt = false

[functions.reconciliar-grade-aluno]
# Worker interno: o gateway não aceita a service key opaca usada entre Edges
# (mesmo motivo de transcrever-mensagem-evasao). A função valida o bearer por
# comparação constante com SUPABASE_SERVICE_ROLE_KEY antes de ler o body.
verify_jwt = false

[functions.processar-conversa-evasao]
# pg_cron não possui JWT de service_role neste projeto; autenticação interna
# ocorre no código por x-sync-token antes de ler body ou criar o cliente.
verify_jwt = false

[functions.processar-alertas-lia]
# Dispatcher backend-only. O gateway e o código exigem service_role.
verify_jwt = true

[functions.webhook-whatsapp-inbox]
# Compatibility mode is the default until caixa 3 is provisioned.
# Enable later only with WEBHOOK_INBOUND_SECRET_ENFORCEMENT=true.
# Gateway sem JWT: autenticação do provedor ocorre no código por segredo por caixa.
verify_jwt = false

[functions.configurar-webhook-caixa]
# Operacao privilegiada: o gateway e o codigo exigem JWT; o codigo tambem exige admin ativo.
verify_jwt = true

[functions.sync-presenca-emusys]
# O gateway fica aberto apenas para permitir o segredo dedicado dos crons.
# A funcao valida service_role, x-sync-token ou JWT+permissao antes dos sinks.
verify_jwt = false

[functions.sync-grade-futura-emusys]
# Worker interno: a grade futura escreve com service_role e o gateway deve
# validar o JWT. Declarar isto evita que um deploy futuro abra a funcao.
verify_jwt = true

[functions.previsualizar-reconciliacao-grade-emusys]
# Ferramenta temporaria de auditoria: sem JWT no gateway porque autentica no
# proprio codigo por token efemero hasheado; nao possui CORS nem comandos de escrita.
# A orquestracao invalida a versao imediatamente depois da previsualizacao autorizada.
verify_jwt = false

[functions.gerar-relatorio-pedagogico]
verify_jwt = false

[functions.backfill-historico-professor-emusys]
verify_jwt = true

[functions.reconstruir-periodos-professor]
verify_jwt = true

# Orquestrador do pipeline de histórico do professor, chamado por cron.
# ⚠️ verify_jwt = TRUE de propósito. Com `false`, o gateway não valida a assinatura do JWT
# e ler o claim `role` seria forjável por qualquer um. Com `true`, a assinatura já vem
# validada e a edge pode confiar no claim — que é o que cobre rotação de chave (a
# service_role do `.env` pode ser de outra geração que a variável interna da função).
# O cron manda `Authorization: Bearer <service_role>`, como manda a regra do projeto.
# Bônus: um redeploy pelo MCP reseta verify_jwt para `true`, que aqui é o valor CORRETO —
# esta edge não pode ser derrubada por aquela armadilha.
[functions.orquestrar-historico-professor]
verify_jwt = true

[functions.export-contas-receber]
# Integracao servidor-servidor: autentica o segredo dedicado no proprio codigo.
verify_jwt = false

[functions.refresh-contas-receber]
# Integracao servidor-servidor: autentica o segredo dedicado no proprio codigo.
verify_jwt = false

[functions.sync-faturas-emusys]
# Publicacao financeira aceita somente JWT tecnico ou service_role validado pelo gateway.
verify_jwt = true

[functions.sync-matriculas-emusys]
# Cadastro de alunos: gateway e codigo exigem JWT tecnico ou service_role.
# Declarado para que um deploy futuro nao altere a protecao vigente por omissao.
verify_jwt = true

[functions.sync-professor-disciplinas-emusys]
# Cron usa segredo dedicado; navegador valida JWT e permissao dentro da funcao.
verify_jwt = false

[functions.varrer-atribuicao-meta-ads]
# Cron manda x-sync-token; navegador manda JWT. Os dois sao validados DENTRO da funcao.
# Sem esta linha o gateway devolve 401 antes do codigo rodar e o pg_cron ainda assim
# marca "succeeded" -- falha silenciosa. Ver comentario no topo do index.ts.
verify_jwt = false

[functions.atualizar-inadimplencia-emusys]
# Endpoint de compatibilidade do botao: navegador manda JWT e servidor pode mandar
# x-sync-token, ambos validados dentro da funcao. Ele apenas encaminha para a fila unica
# de contas a receber e nao grava mais o booleano concorrente na jornada.
verify_jwt = false

[functions.debug-webhook-emusys-observador]
# Webhook chamado direto pelo Emusys, que nao manda Authorization. Com verify_jwt = true o
# gateway devolve 401 antes do codigo rodar e a funcao para de receber -- sem erro visivel,
# porque quem chama e o Emusys e ele nao reenvia. A autenticacao propria e o OBSERVADOR_TOKEN
# (validado DENTRO da funcao, hoje desligado ate sabermos se o Emusys manda header custom).
# Estava faltando aqui ate 06/08/2026: a funcao rodava com false em producao sem nada no repo
# declarar isso, entao um deploy pelo MCP (que reseta para true) a derrubaria em silencio.
verify_jwt = false

[functions.processar-matricula-emusys]
# ATENCAO: aqui verify_jwt = TRUE de proposito (conferido em producao 06/08/2026, version 78).
# Ao contrario do observador, esta funcao NAO e chamada direto pelo Emusys: o webhook passa pelo
# n8n, que manda Authorization. Deployar com false abriria o processamento de matricula para
# qualquer chamada anonima. O motivo de estar declarado aqui e o inverso do caso do observador --
# nao para impedir que o MCP resete para true, e sim para que ninguem "corrija" para false por
# analogia com as outras funcoes de webhook do Emusys.
verify_jwt = true

[functions.base-conhecimento]
# Chamada pelo no `bd_conhecimento` dos agentes SDR Mila no n8n, que faz GET
# simples e NAO manda header. A autenticacao e um token dedicado na query
# string, validado DENTRO da funcao contra `integracao_tokens`.
# Sem esta linha o gateway devolve 401 antes do codigo rodar.
verify_jwt = false

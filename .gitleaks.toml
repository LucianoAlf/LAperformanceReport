# Config do gitleaks — barra segredos antes de entrarem no repo.
# Roda no CI (.github/workflows/gitleaks.yml) a cada push.
# Estende o conjunto padrão de regras do gitleaks.
[extend]
useDefault = true

[allowlist]
description = "Valores que NÃO são segredo (não devem gerar alerta)"
regexes = [
  # UUIDs das unidades (IDs públicos, aparecem em código e docs)
  '''2ec861f6-023f-4d7b-9927-3960ad8c2a92''',
  '''95553e96-971b-4590-a6eb-0201d013c14d''',
  '''368d47f5-2d88-4475-bc14-ba084a9a348e''',
  # Supabase anon/publishable key (pública por design — protegida por RLS, não por sigilo)
  '''sb_publishable_[A-Za-z0-9_]+''',
  # marcadores de token já redigido
  '''‹token[^›]*›''',
]
paths = [
  '''\.env\.example$''',
]

# Nome de indice do Postgres nao e chave de API.
# O gerador de docs/banco escreve a lista de indices unicos de cada tabela, e
# todo unique constraint do Postgres termina em '_key' -- o que faz a regra
# generic-api-key casar por sufixo + entropia do nome truncado (ex.:
# 'professor_periodos_reconstruc_unidade_id_data_inicio_data_f_key'). Foram 8
# falsos positivos na primeira geracao, nenhum segredo.
#
# O recorte e a LINHA, nao o diretorio: linhas de '**Unicos:**' sao ignoradas,
# enquanto DEFAULT de coluna e COMMENT continuam sendo varridos -- que sao os
# lugares onde um segredo de verdade apareceria num doc gerado do banco.
[[allowlists]]
description = "Linha de indices unicos nos mapas de banco gerados"
regexTarget = "line"
regexes = [
  '''^\*\*Únicos:\*\* ''',
]

